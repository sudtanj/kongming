    <script>
      /* Apply the stored theme before first paint to avoid a flash. */
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem("kongming.theme"); } catch (e) {}
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) { var c = meta.getAttribute(dark ? "data-theme-color-dark" : "data-theme-color-light"); if (c) meta.setAttribute("content", c); }
        } catch (e) {}
      })();
    </script>
